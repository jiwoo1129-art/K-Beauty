 Amazon Beauty Listing Workspace · <span data-t="disclaimer"></span></footer><script>

sc:'Build an Amazon listing draft using your product attributes and brand voice.',new1:'Draft from verified product information',new2:'Structure title, bullets and search terms',new3:'Review and export as TXT',startWrite:'Start Creating →',startDraft:'START WITH AN EXISTING DRAFT',reviewTitle:'Review an Existing Listing',reviewDesc:'Screen your product copy for statements requiring further review.',review1:'Upload TXT or HTML drafts',review2:'Identify potentially risky wording',review3:'Move your copy back to the creator',startCheck:'Start Review →',workflow:'From product facts to final review',s1:'Verify Product Facts',s1d:'Prepare ingredients, attributes and evidence.',s2:'Draft & Review',s2d:'Build a draft and screen its claims.',s3:'Revise & Export',s3d:'Copy or download the revised wording.',writeTitle:'Create a New Listing',writeHelp:'Enter only confirmed information. Generate an English Amazon US listing template.',productName:'Product name',brand:'Brand',category:'Product category',tone:'Brand voice',ingredients:'Verified key ingredients (comma-separated)',facts:'Substantiated product features (one per line)',generate:'Generate Draft',reset:'Reset',draftPreview:'English Listing Draft',copy:'Copy',download:'Download TXT',sendCheck:'Send to Review',demoNotice:'This browser-based draft template uses your inputs. No AI generation or authoritative policy compliance API is connected.',checkTitle:'Review an Existing Listing',checkHelp:'Paste your listing or upload a TXT / HTML file.',upload:'Upload file',listing:'Listing text',analyze:'Run Preliminary Screening',reviewNotice:'Keyword screening is not a formal Amazon/FDA compliance determination.',disclaimer:'Demo · Not a formal compliance determination',empty:'Please enter some content.',noRisk:'No configured keyword patterns detected. This does not guarantee compliance.',found:'Flagged phrase',reason:'May imply drug effects or guarantees; verify evidence and applicable regulations.',checked:'Preliminary screening let lang=localStorage.getItem('complyLang')==='en'?'en':'ko';let page='home';const $=s=>document.querySelector(s);const t=k=>D[lang][k];function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-lang]').forEach(e=>e.classList.toggle('active',e.dataset.lang===lang));document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===page));['home','write','check'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==page));document.title=(lang==='ko'?'COMPLY.AI · 뷰티 리스팅 스튜디오':'COMPLY.AI · Beauty Listing Studio')}function go(p){page=p;render();window.scrollTo(0,0)}document.querySelectorAll('[data-lang]').forEach(e=>e.onclick=()=>{lang=e.dataset.lang;localStorage.setItem('complyLang',lang);render()});document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>go(e.dataset.nav));document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));let draft='';$('#generate').onclick=()=>{const name=$('#pname').value.trim(),brand=$('#brand').value.trim();if(!name||!brand)return alert(t('missing'));const facts=$('#facts').value.split('\n').map(s=>s.trim()).filter(Boolean),ingredients=$('#ingredients').value.split(',').map(s=>s.trim()).filter(Boolean);const safeFacts=facts.slice(0,5);draft=`TITLE\n${brand} ${name} - ${$('#type').selectedOptions[0].text.split('/')[0].trim()}\n\nKEY PRODUCT FEATURES\n${(safeFacts.length?safeFacts:['Product details to be verified before publication']).map((s,i)=>`• ${s}`).join('\n')}\n\nPRODUCT DESCRIPTION\nDiscover ${brand} ${name}. ${safeFacts.join('. ')}${safeFacts.length?'.':''}\n\nKEY INGREDIENTS\n${ingredients.length?ingredients.join(', '):'Not supplied'}\n\nBACKEND SEARCH TERMS\n${[brand,name,...ingredients].join(' ').replace(/[^\w\s-]/g,' ').toLowerCase().replace(/\s+/g,' ').trim()}\n\nNOTE: Verify all claims, ingredients, title limits, keyword policies and applicable Amazon/FDA requirements before publishing.`;$('#draftText').textContent=draft;$('#draftArea').classList.remove('hidden')};$('#reset').onclick=()=>{['pname','brand','ingredients','facts'].forEach(id=>$('#'+id).value='');$('#draftArea').classList.add('hidden');draft=''};$('#copy').onclick=()=>navigator.clipboard.writeText(draft);$('#download').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([draft],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='comply-ai-listing.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#sendCheck').onclick=()=>{$('#listing').value=draft;go('check')};$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6)return alert('Maximum file size: 2MB');let s=await f.text();if(/\.html?$/i.test(f.name)){const doc=new DOMParser().parseFromString(s,'text/html');s=doc.body.textContent||''}$('#listing').value=s};const patterns=[/\b(cure|cures|cured|treats?|heals?|prevent(?:s)?|antibacterial|antifungal|anti-inflammatory)\b/gi,/\b(fda approved|clinically proven|guaranteed|100% safe|permanent results|miracle)\b/gi,/\b(acne treatment|eczema|psoriasis|rosacea|skin cancer)\b/gi,/\b(치료|완치|염증 제거|여드름 치료|FDA 승인|부작용 없음|100% 안전)\b/gi];$('#analyze').onclick=()=>{const val=$('#listing').value;if(!val.trim())return alert(t('empty'));const found=[...new Set(patterns.flatMap(re=>[...val.matchAll(re)].map(x=>x[0])))].slice(0,30),area=$('#reviewArea');area.replaceChildren();const h=document.createElement('h3');h.textContent=t('checked')+' · '+found.length;area.append(h);if(!found.length){let p=document.createElement('p');p.textContent=t('noRisk');area.append(p)}else found.forEach(x=>{let div=document.createElement('div');div.className='risk';let b=document.createElement('b');b.textContent=t('found')+': '+x;let p=document.createElement('p');p.textContent=t('reason');div.append(b,p);area.append(div)});area.classList.remove('hidden')};render();
</script></body></html>
